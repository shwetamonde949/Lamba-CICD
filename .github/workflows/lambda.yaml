name: Deploy AWS Lambda
on:
 push:
  branches:
   - main
  paths:
   - 'lambda/**'

jobs:
 deploy-lambda: #name of the job
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4

  - name: Set Up Python #Sets up python env
    uses: actions/setup-python@v5
    with:
     python-version: '3.12'

  - name: Install Dependencies #Installs any packages
    run: |
     python -m pip install --upgrade pip
     pip install -r lambda/requirements.txt -t lambda/

  - name: Configure AWS Creds  #Setsup AWS credentials
    uses: aws-actions/configure-aws-credentials@v1
    with:
     aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
     aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
     aws-region: us-east-2

  - name: Deploy Lambda Function  #Zips Lambda Directory and updates lambda function
    run: |
     cd lambda
     zip -r lambda.zip .
     aws lambda update-function-code --function-name test-cicd-lambda --zip-file fileb://lambda.zip
